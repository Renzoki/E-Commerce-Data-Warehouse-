<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse · E-Commerce DW</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <h1>Browse</h1>
    <p class="lead">Raw rows from the <code>ecommerce_dw</code> warehouse. Pick a table, then search or click a column header to sort.</p>

    <form class="toolbar" id="controls" onsubmit="return false">
      <label>Table
        <select id="dataset"></select>
      </label>
      <label class="grow">Search
        <input id="search" type="search" placeholder="Search all columns…">
      </label>
      <label>Rows per page
        <select id="pageSize">
          <option>25</option><option selected>50</option><option>100</option>
        </select>
      </label>
    </form>

    <div class="card">
      <p class="muted" id="datasetInfo"></p>
      <div class="table-meta">
        <span id="count"></span>
        <span id="mockNote" class="badge" hidden>Mock data</span>
      </div>
      <div id="table"></div>
      <div class="pager">
        <button id="prev" type="button">← Prev</button>
        <span id="pageInfo"></span>
        <button id="next" type="button">Next →</button>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/browse.js"></script>
</body>
</html>
